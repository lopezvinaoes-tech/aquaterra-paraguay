    g.strokeStyle = 'rgba(55,54,52,0.8)'; g.lineWidth = 4; g.beginPath(); g.moveTo(px(-60), 0); g.lineTo(px(-60), 2048); g.stroke();
    g.fillStyle = 'rgba(112,128,84,0.75)'; for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(px(-2600 + rnd() * 5200), pz(-4200 + rnd() * 4400), 6 + rnd() * 14, 4 + rnd() * 10, rnd() * 3, 0, 7); g.fill(); }
    g.save(); g.translate(px(0), pz(-1900)); g.scale(1, 4200 / 4400);
    const r = 4400 / S * 2048, gr = g.createRadialGradient(0, 0, r * 0.82, 0, 0, r * 1.25); gr.addColorStop(0, 'rgba(205,184,148,0)'); gr.addColorStop(1, 'rgba(205,184,148,1)');
    g.fillStyle = gr; g.fillRect(-2048, -2048, 4096, 4096); g.restore();
  });

  gm.rotation.x = -Math.PI / 2; gm.position.z = Z0; gm.receiveShadow = true; scene.add(gm);

  const asp = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#48494c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 5000; i++) { const v = 50 + rnd() * 60; g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 3) + ',0.6)'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); } });
  const rd = new GB();
  for (let k = -15; k <= 10; k++) { const zc = 60 + k * 120; for (let x0 = -1370; x0 < 1370; x0 += 120) { const x1 = Math.min(1370, x0 + 120); if (landD(x0, zc) > 12 && landD(x1, zc) > 12) rd.cap(rect((x0 + x1) / 2, zc, x1 - x0 + 22, 22), 0.03, null, 7); } }
  for (let k = -12; k <= 10; k++) { const xc = 60 + k * 120; for (let z0 = -1740; z0 < 1300; z0 += 120) { const z1 = Math.min(1300, z0 + 120); if (landD(xc, z0) > 12 && landD(xc, z1) > 12) rd.cap(rect(xc, (z0 + z1) / 2, 22, z1 - z0 + 22), 0.03, null, 7); } }
  const roads = new THREE.Mesh(rd.geo(), new THREE.MeshStandardMaterial({ map: asp, roughness: 0.92 })); roads.receiveShadow = true; scene.add(roads);

  const pav = canvasTex(256, 256, (g, w, hh) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, hh); for (let i = 0; i < 3000; i++) { const v = 200 + rnd() * 55; g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v - 6) + ',0.5)'; g.fillRect(rnd() * w, rnd() * hh, 2, 2); } g.strokeStyle = 'rgba(120,115,105,0.35)'; for (let k = 0; k <= 8; k++) { g.beginPath(); g.moveTo(k * 32, 0); g.lineTo(k * 32, hh); g.moveTo(0, k * 32); g.lineTo(w, k * 32); g.stroke(); } }); pav.repeat.set(16, 16);
  const slabI = new THREE.InstancedMesh(new THREE.BoxGeometry(98, 0.22, 98).translate(0, 0.11, 0), new THREE.MeshStandardMaterial({ map: pav, roughness: 0.9 }), slabs.length);
  const sc = new THREE.Color();
  slabs.forEach((s, i) => { m4.makeTranslation(s[0], 0, s[1]); slabI.setMatrixAt(i, m4); slabI.setColorAt(i, sc.set(pick(['#c9c0b0', '#bdb4a4', '#d3cbbb', '#b3ab9d']))); });
  slabI.receiveShadow = true; scene.add(slabI);

    

  const water = waterMat;
  const rib = (gb, f0, f1, y) => { for (let t = -7000; t < 9000; t += 40) { let q = [f0(t), f0(t + 40), f1(t + 40), f1(t)]; const sg = (q[1][0] - q[0][0]) * (q[2][1] - q[0][1]) - (q[1][1] - q[0][1]) * (q[2][0] - q[0][0]); if (sg > 0) q = q.reverse(); gb.cap(q, y, null); } };
  const sea = new GB(); rib(sea, t => shoreAt(t, 0), t => shoreAt(t, 20000), 0.3); scene.add(new THREE.Mesh(sea.geo(), water));
  const foam = new GB(); rib(foam, t => shoreAt(t, 0), t => shoreAt(t, 9 + 4 * Math.sin(t / 120)), 0.34); scene.add(new THREE.Mesh(foam.geo(), new THREE.MeshStandardMaterial({ color: 0xe8f0f0, roughness: 0.6, transparent: true, opacity: 0.55, depthWrite: false })));
  const beach = new GB(); rib(beach, t => shoreAt(t, 0), t => shoreAt(t, -beachW(t)), 0.2); const bm = new THREE.Mesh(beach.geo(), new THREE.MeshStandardMaterial({ color: 0xe0cfae, roughness: 1 })); bm.receiveShadow = true; scene.add(bm);
  const park = new GB(); rib(park, t => shoreAt(t, -beachW(t)), t => shoreAt(t, -beachW(t) - parkW(t)), 0.12); const pm = new THREE.Mesh(park.geo(), new THREE.MeshStandardMaterial({ color: 0x8c9c6a, roughness: 1 })); pm.receiveShadow = true; scene.add(pm);
  const TN = small ? 700 : 1400, trees = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ roughness: 1 }), TN), tc = new THREE.Color();
  for (let i = 0; i < TN; i++) { const t = -2500 + rnd() * 10000, off = -beachW(t) - 12 - rnd() * (parkW(t) - 24), p = shoreAt(t, off), s = 5 + rnd() * 7; m4.compose(v3.set(p[0], s * 0.85, p[1]), q4.identity(), s3.set(s, s * (0.8 + rnd() * 0.4), s)); trees.setMatrixAt(i, m4); trees.setColorAt(i, tc.set(pick(['#6f8450', '#5f7444', '#7d9258', '#56693e']))); }
  trees.castShadow = true; trees.receiveShadow = true; scene.add(trees);
  const lake = new THREE.Mesh(new THREE.CircleGeometry(1, 48), water); lake.rotation.x = -Math.PI / 2; lake.scale.set(170, 80, 1); lake.position.set(BX, 0.25, BZ + 215); scene.add(lake);
}

// ---------- clouds
function cloudTex() {
  return canvasTex(256, 128, (g) => {
    for (let i = 0; i < 44; i++) { const x = 40 + rnd() * 176, y = 62 + (rnd() - 0.65) * 40, r = 10 + rnd() * 26 * (1 - Math.abs(x - 128) / 170); const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.55, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
    g.globalCompositeOperation = 'source-atop'; const sh = g.createLinearGradient(0, 30, 0, 110); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(150,163,180,0.6)'); g.fillStyle = sh; g.fillRect(0, 0, 256, 128);
    g.globalCompositeOperation = 'destination-out'; const cut = g.createLinearGradient(0, 78, 0, 96); cut.addColorStop(0, 'rgba(0,0,0,0)'); cut.addColorStop(1, 'rgba(0,0,0,1)'); g.fillStyle = cut; g.fillRect(0, 78, 256, 50);
  });
}
const cTex = [cloudTex(), cloudTex(), cloudTex()];
const cMats = []; cTex.forEach(t => [0.65, 0.82, 0.95].forEach(o => { const m = new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, opacity: o }); m.color.setRGB(1.22, 1.22, 1.25); cMats.push(m); }));
const clouds = [];
function addClouds(n, y0, y1, s0, s1, xr, zr) {
  for (let i = 0, tries = 0; i < n && tries < n * 20; tries++) {
    const s = s0 + rnd() * (s1 - s0), p = new THREE.Vector3(xr[0] + rnd() * (xr[1] - xr[0]), y0 + rnd() * (y1 - y0), zr[0] + rnd() * (zr[1] - zr[0]));
    if (path.some(c => Math.hypot(c.x - p.x, c.y - p.y, c.z - p.z) < s * 0.6 + 60)) continue;
    if (Math.hypot(p.x - BX, p.z - BZ) < s * 0.6 + 120) continue;
    const sp = new THREE.Sprite(pick(cMats)); sp.position.copy(p); sp.scale.set(s, s * 0.5, 1); scene.add(sp); clouds.push(sp); i++;
  }
}
addClouds(45, 1800, 2700, 700, 1600, [-6500, 6500], [-9000, 2500]);

// ---------- reflections: sky first, then the city itself
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const es = new THREE.Scene(); es.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
  const skyEnv = pmrem.fromScene(es, 0.02, 0.1, 100); scene.environment = skyEnv.texture;
  const rt = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType }), cc = new THREE.CubeCamera(1, 16000, rt);
  cc.position.set(0, 190, 0); sky.position.copy(cc.position); hero.visible = false;
  placeShadow(0.15); cc.update(renderer, scene); hero.visible = true;
  scene.environment = pmrem.fromCubemap(rt.texture).texture; rt.dispose(); waterMat.envMap = skyEnv.texture;
}
function placeShadow(a) {
  const sc = sun.shadow.camera, half = lerp(260, 2000, a), cx = lerp(0, 330, a), cz = lerp(20, -2000, a);
  sun.target.position.set(cx, 0, cz); sun.position.set(cx + SUN.x * 4000, SUN.y * 4000, cz + SUN.z * 4000);
  if (Math.abs(sc.right - half) > 2) { sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.updateProjectionMatrix(); }
  sun.shadow.normalBias = lerp(0.08, 1.5, a);
}

// ---------- state & loop
let target = 0, P = reduce ? 1 : 0, last = performance.now();
addEventListener('message', e => { if (e.data && e.data.type === 'aq-city') { target = cl(+e.data.p || 0); if (document.hidden) { P = reduce ? 1 : target; draw(performance.now(), 0); } } });
function resize() {
  const w = innerWidth || 800, h = innerHeight || 600, portrait = h > w * 1.05;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = portrait ? 70 : 56; pitch0 = (camera.fov / 2 + 2) * D2R; pitchEnd = (portrait ? 49 : 46) * D2R;
  if (w / h > 1.25) camera.setViewOffset(w, h, -w * 0.12, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let visible = true; if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(document.body);

function draw(now, dt) {
  const t = now / 1000;
  const goal = reduce ? 1 : target;
  P += (goal - P) * (1 - Math.exp(-dt * 3.2));
  if (Math.abs(goal - P) < 1e-4) P = goal;
  const o = pose(P), sway = reduce ? 0 : 1;
  camera.position.set(o.x, o.y + Math.sin(t * 0.7) * 0.25 * o.a * sway, o.z);
  camera.rotation.set(o.pitch + Math.sin(t * 0.43) * 0.0016 * sway, o.yaw + Math.sin(t * 0.31) * 0.0024 * (0.4 + o.a) * sway, 0);
  sky.position.copy(camera.position);
  placeShadow(o.a);
  if (!reduce) { for (const c of clouds) { c.position.x += dt * 3.2; if (c.position.x > 6600) c.position.x -= 13200; } }
  renderer.render(scene, camera);
}
function frame(now) {
  requestAnimationFrame(frame); if (window.__shotOn) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!visible || document.hidden) return;
  draw(now, dt);
}
const SHOTS = [
  { p: [14, 24, 330], t: [0, 300, -10], a: 0.12, fov: 54 },
  { p: [1500, 760, -700], t: [380, 420, -2300], a: 0.85, fov: 44 },
  { p: [-600, 460, 950], t: [40, 40, -650], a: 0.5, fov: 50 },
  { p: [-1450, 420, 1100], t: [-2500, 0, -700], a: 0.7, fov: 52 },
  { p: [40, 120, 300], t: [0, 470, 0], a: 0.15, fov: 50 },
  { p: [700, 1500, 1500], t: [0, 0, -1800], a: 1, fov: 48 }
];

const SHOTQ = new URLSearchParams(location.search).get('shot');
if (SHOTQ != null) window.shot(+SHOTQ); else { draw(performance.now(), 1); requestAnimationFrame(frame); }
